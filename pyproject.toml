[project]
name = "scgraph"
version = "0.1.0"
description = "Semiconductor supply-chain graph from public filings: network structure, shock propagation and customer-to-supplier return predictability."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "pyarrow>=14", "pyyaml>=6", "requests>=2.31",
    "yfinance>=0.2.40", "exchange_calendars>=4.5", "statsmodels>=0.14", "networkx>=3.2",
    "matplotlib>=3.8", "plotly>=5.20", "lxml>=5",
    "overfit @ git+https://github.com/vendraholdings/backtest-overfitting@8894c2aa909f20cd3092e2172ee892faa372a7c2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "typst>=0.15.2", "playwright==1.65.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["scgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
